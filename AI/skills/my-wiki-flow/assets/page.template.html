<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}} — {{SITE_TITLE}}</title>
  <meta name="description" content="{{SUMMARY}}">
  <link href="{{PAGEFIND_CSS}}" rel="stylesheet">
  <link rel="stylesheet" href="{{CSS_HREF}}">
  <!-- Resolve relative bundle path to an absolute pathname (Component UI requirement). -->
  <pagefind-config data-bundle-rel="{{PAGEFIND_BUNDLE}}"></pagefind-config>
  <script>
    (function () {
      var cfg = document.querySelector("pagefind-config[data-bundle-rel]");
      if (!cfg) return;
      var rel = cfg.getAttribute("data-bundle-rel") || "";
      try {
        var abs = new URL(rel, window.location.href);
        var path = abs.pathname;
        if (path.slice(-1) !== "/") path += "/";
        cfg.setAttribute("bundle-path", path);
      } catch (e) {
        cfg.setAttribute("bundle-path", "/pagefind/");
      }
    })();
  </script>
  <script src="{{PAGEFIND_JS}}" type="module"></script>
</head>
<body class="{{BODY_CLASS}}">
  <header class="wiki-header">
    <a class="wiki-brand" href="{{HOME_HREF}}">{{SITE_TITLE}}</a>
    <div class="wiki-search">
      <pagefind-searchbox
        placeholder="Search"
        show-sub-results
        max-results="12"
      ></pagefind-searchbox>
    </div>
  </header>
  <div class="wiki-shell">
    <nav class="wiki-nav" aria-label="Projects">
      <h2>Navigation</h2>
      {{NAV}}
    </nav>
    <main class="wiki-main">
      {{TOC}}
      <article class="wiki-article" data-pagefind-body>
        {{PAGE_KIND}}
        <h1 id="top">{{TITLE}}</h1>
        {{META}}
        {{BODY}}
      </article>
      <footer class="wiki-footer">
        <p>Project: <a href="{{PROJECT_HREF}}">{{PROJECT}}</a> · Source: Markdown in vault · Generated by my-wiki-flow</p>
      </footer>
    </main>
  </div>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

    // Grayscale diagrams — no accent fills.
    mermaid.initialize({
      startOnLoad: false,
      theme: "base",
      securityLevel: "strict",
      flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 50, rankSpacing: 60 },
      c4: {
        useUnifiedRenderer: true,
        wrap: true,
      },
      themeVariables: {
        darkMode: false,
        background: "#ffffff",
        fontFamily: "system-ui, -apple-system, Segoe UI, Roboto, sans-serif",
        primaryColor: "#f8f9fa",
        primaryBorderColor: "#a2a9b1",
        primaryTextColor: "#202122",
        secondaryColor: "#eaecf0",
        secondaryBorderColor: "#72777d",
        secondaryTextColor: "#202122",
        tertiaryColor: "#ffffff",
        tertiaryBorderColor: "#c8ccd1",
        tertiaryTextColor: "#202122",
        lineColor: "#54595d",
        textColor: "#202122",
        mainBkg: "#f8f9fa",
        nodeBorder: "#a2a9b1",
        clusterBkg: "#f8f9fa",
        clusterBorder: "#a2a9b1",
        titleColor: "#202122",
        edgeLabelBackground: "#ffffff",
        actorBkg: "#f8f9fa",
        actorBorder: "#a2a9b1",
        actorTextColor: "#202122",
        actorLineColor: "#a2a9b1",
        signalColor: "#202122",
        signalTextColor: "#202122",
        labelBoxBkgColor: "#f8f9fa",
        labelBoxBorderColor: "#a2a9b1",
        labelTextColor: "#202122",
        loopTextColor: "#202122",
        noteBkgColor: "#eaecf0",
        noteTextColor: "#202122",
        noteBorderColor: "#72777d",
        activationBkgColor: "#eaecf0",
        activationBorderColor: "#72777d",
        sequenceNumberColor: "#ffffff"
      },
      sequence: {
        actorMargin: 64,
        mirrorActors: false,
        bottomMarginAdj: 12,
        messageAlign: "center",
        boxMargin: 12,
        noteMargin: 12
      }
    });

    function enhanceZoomableDiagrams() {
      document.querySelectorAll(".wiki-mermaid[data-zoomable]").forEach((wrap) => {
        const viewport = wrap.querySelector(".wiki-mermaid-viewport");
        const svg = viewport && viewport.querySelector("svg");
        if (!viewport || !svg || wrap.dataset.zoomReady === "1") return;
        wrap.dataset.zoomReady = "1";

        let scale = 1;
        let tx = 0;
        let ty = 0;
        let dragging = false;
        let lastX = 0;
        let lastY = 0;

        const apply = () => {
          svg.style.transformOrigin = "0 0";
          svg.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
        };

        const zoomAt = (factor, clientX, clientY) => {
          const rect = viewport.getBoundingClientRect();
          const x = clientX - rect.left;
          const y = clientY - rect.top;
          const next = Math.min(4, Math.max(0.35, scale * factor));
          const ratio = next / scale;
          tx = x - (x - tx) * ratio;
          ty = y - (y - ty) * ratio;
          scale = next;
          apply();
        };

        const reset = () => {
          scale = 1;
          tx = 0;
          ty = 0;
          apply();
        };

        wrap.querySelectorAll("[data-zoom]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const action = btn.getAttribute("data-zoom");
            if (action === "in") zoomAt(1.25, viewport.clientWidth / 2, viewport.clientHeight / 2);
            else if (action === "out") zoomAt(0.8, viewport.clientWidth / 2, viewport.clientHeight / 2);
            else reset();
          });
        });

        viewport.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.1 : 0.9;
            zoomAt(factor, e.clientX, e.clientY);
          },
          { passive: false }
        );

        viewport.addEventListener("pointerdown", (e) => {
          if (e.button !== 0) return;
          dragging = true;
          lastX = e.clientX;
          lastY = e.clientY;
          viewport.classList.add("is-panning");
          viewport.setPointerCapture(e.pointerId);
        });
        viewport.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          tx += e.clientX - lastX;
          ty += e.clientY - lastY;
          lastX = e.clientX;
          lastY = e.clientY;
          apply();
        });
        const endPan = (e) => {
          dragging = false;
          viewport.classList.remove("is-panning");
          try {
            viewport.releasePointerCapture(e.pointerId);
          } catch (_) {}
        };
        viewport.addEventListener("pointerup", endPan);
        viewport.addEventListener("pointercancel", endPan);

        apply();
      });
    }

    await mermaid.run({ querySelector: ".mermaid" });

    // Fit C4 / large diagrams: ensure viewBox covers full ink + pad so labels are not clipped.
    document.querySelectorAll(".wiki-mermaid-viewport svg").forEach((svg) => {
      try {
        const box = svg.getBBox();
        if (!box || !isFinite(box.width) || box.width <= 0) return;
        const pad = 24;
        svg.setAttribute(
          "viewBox",
          `${box.x - pad} ${box.y - pad} ${box.width + pad * 2} ${box.height + pad * 2}`
        );
        svg.removeAttribute("height");
        svg.style.width = "100%";
        svg.style.maxWidth = "100%";
        svg.style.height = "auto";
      } catch (_) {}
    });

    enhanceZoomableDiagrams();
  </script>
  <script>
    (function () {
      var STORAGE_KEY = "my-wiki-nav-collapsed";

      function loadState() {
        try {
          return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}") || {};
        } catch (e) {
          return {};
        }
      }

      function saveState(state) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      function setCollapsed(el, collapsed, state) {
        el.classList.toggle("is-collapsed", collapsed);
        var btn = el.querySelector(":scope > .nav-toggle, :scope > .nav-row > .nav-toggle");
        if (btn) btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
        var id = el.getAttribute("data-nav-id");
        if (id && state) {
          if (collapsed) state[id] = true;
          else delete state[id];
        }
      }

      function initNavCollapse() {
        var nav = document.querySelector(".wiki-nav");
        if (!nav) return;
        var state = loadState();

        nav.querySelectorAll(".nav-collapsible[data-nav-id]").forEach(function (el) {
          var id = el.getAttribute("data-nav-id");
          var preferOpen = el.classList.contains("has-current");
          var collapsed = preferOpen ? false : !!state[id];
          setCollapsed(el, collapsed, null);
        });

        nav.addEventListener("click", function (e) {
          var btn = e.target.closest(".nav-toggle");
          if (!btn || !nav.contains(btn)) return;
          e.preventDefault();
          var el = btn.closest(".nav-collapsible");
          if (!el) return;
          var next = !el.classList.contains("is-collapsed");
          var st = loadState();
          setCollapsed(el, next, st);
          saveState(st);
        });
      }

      window.addEventListener("DOMContentLoaded", function () {
        initNavCollapse();
      });
    })();
  </script>
</body>
</html>
